name: Intelligence pipeline

# Free scheduler: Vercel Hobby crons run once a day, so this workflow drives the
# pipeline every 3 hours by calling the app's protected job endpoints.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL      e.g. https://ai-pulse.vercel.app   (no trailing slash)
#   CRON_SECRET  the same value as the CRON_SECRET environment variable in Vercel
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets are not set — skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        if: steps.cfg.outputs.ready == 'true'
        run: |
          call() {
            echo "::group::$1"
            # The secret is passed in a header and never echoed; only the JSON result is printed.
            code=$(curl -sS -o result.json -w "%{http_code}" --max-time 320 \
              -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/$1" || echo "000")
            cat result.json 2>/dev/null || true
            echo
            echo "HTTP $code"
            echo "::endgroup::"
            [ "$code" = "200" ]
          }
          call ingest
          # Enrichment is time-boxed per call and resumable; a few passes clear the day's queue.
          call enrich || true
          call enrich || true
          call enrich || true
          call insights || true
          call daily
